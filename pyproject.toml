[project]
name = "pystou"
version = "0.7.0"
description = "Python scripts for deduplicating folders and unarchiving files."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ICIJ" }]
keywords = ["deduplication", "archive", "filesystem", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["typer>=0.12", "rich>=13"]

[project.urls]
Homepage = "https://github.com/ICIJ/pystou"
Repository = "https://github.com/ICIJ/pystou"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pystou = "pystou.main:main"






[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "cleanup",
    "common",
    "dedup_folders",
    "doctor",
    "empty",
    "extract",
    "identify",
    "normalize",
    "pystou",
    "restore",
    "stats",
    "trash",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately do late imports (after sys.path setup), alias Path, and
# use throwaway lambdas in stub classes.
"tests/*" = ["E402", "N814", "E731"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["pystou/__init__.py:__version__"]
build_command = "pip install build && python -m build"
commit_message = "chore(release): v{version}"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"
