name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only run on the canonical repo, never on forks.
    if: github.repository == 'ICIJ/pystou'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Not the upstream action: it resolves its dependencies when its Docker
      # image is built, so every run now pulls GitPython 3.1.60, which dropped
      # Actor.name_email_regex and crashes semantic-release on startup. Running
      # the CLI directly is what lets us hold GitPython back. Restore the action
      # once python-semantic-release stops using that attribute.
      - name: Install Python Semantic Release
        run: pip install 'python-semantic-release==9.21.2' 'gitpython<3.1.60'

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v version

      - name: Upload distributions
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
